[project]
name = "litmat-agent"
version = "0.1.0"
description = "面向固态电解质研发的文献驱动科学发现智能体系统"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.6",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litmat_agent"]
